name: Firmware

# Builds the ESP32-C3 image and publishes the web installer + OTA manifest on
# GitHub Pages – only when the firmware or the installer page changes. The
# firmware version is the `project: version:` in esphome/qlima-control.yaml.
# ESPs running the image see a new version as an update in Home Assistant and
# install it themselves when "Opdatér automatisk" is on.

on:
  pull_request:
    paths: ["esphome/**", "docs/**", ".github/workflows/firmware.yml", "tests/check_ota_packages.py"]
  push:
    branches: [main]
    paths: ["esphome/**", "docs/**", ".github/workflows/firmware.yml", "tests/check_ota_packages.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version
        id: v
        run: |
          VERSION=$(grep -m1 -E '^ +version: "' esphome/qlima-control.yaml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware $VERSION"
      - name: Build firmware
        run: |
          pip install "esphome==2026.9.1"
          python3 tests/check_ota_packages.py
          esphome config esphome/qlima-control-esp32c3.yaml
          esphome compile esphome/qlima-control-factory.yaml
      - name: Assemble site
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          BUILD=$(dirname "$(find esphome/.esphome/build -name firmware.factory.bin | head -1)")
          mkdir -p _site/firmware
          cp -r docs/* _site/
          cp "$BUILD/firmware.factory.bin" _site/firmware/qlima-control-esp32c3.factory.bin
          cp "$BUILD/firmware.ota.bin" _site/firmware/qlima-control-esp32c3.ota.bin
          python3 - <<'PY'
          import hashlib, json, os
          v = os.environ["VERSION"]
          ota = open("_site/firmware/qlima-control-esp32c3.ota.bin", "rb").read()
          manifest = {
              "name": "Qlima Control",
              "version": v,
              "home_assistant_domain": "esphome",
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32-C3",
                  "parts": [{"path": "qlima-control-esp32c3.factory.bin", "offset": 0}],
                  "ota": {
                      "path": "qlima-control-esp32c3.ota.bin",
                      "md5": hashlib.md5(ota).hexdigest(),
                      "release_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/CHANGELOG.md",
                      "summary": f"Qlima Control firmware {v}",
                  },
              }],
          }
          json.dump(manifest, open("_site/firmware/qlima-control-esp32c3.manifest.json", "w"), indent=2)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
