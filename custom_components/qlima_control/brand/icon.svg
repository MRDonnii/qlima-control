<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4ef"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="0.5" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- wall unit -->
  <g filter="url(#shadow)">
    <rect x="92" y="112" width="328" height="128" rx="40" fill="url(#unit)"/>
    <rect x="124" y="196" width="264" height="14" rx="7" fill="#1b3350" opacity="0.85"/>
    <circle cx="378" cy="146" r="9" fill="#34d399"/>
    <rect x="124" y="140" width="96" height="10" rx="5" fill="#9fb3c8"/>
  </g>
  <!-- airflow -->
  <g fill="none" stroke="url(#air)" stroke-linecap="round" stroke-width="20">
    <path d="M150 284 C 190 318, 230 318, 256 300 S 322 282, 362 316"/>
    <path d="M170 344 C 206 374, 240 372, 262 356 S 316 340, 344 368" opacity="0.8"/>
    <path d="M196 400 C 222 420, 248 418, 264 408 S 300 398, 318 414" opacity="0.6"/>
  </g>
</svg>
